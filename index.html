<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/index.css">

    <script src="js/components.js"></script>
    <script src="js/navbar-scroll.js" defer></script>
    <script src="js/hover-tilt.js" defer></script>
    <script src="js/wave-divider.js" defer></script>
    <script src="js/icon-divider.js" defer></script>
    <script src="https://kit.fontawesome.com/c19e667509.js" crossorigin="anonymous"></script>

    <title>Mprins Creations</title>
    <meta name="description" content="I make art, comics and animations">
    <meta name="keywords" content="Art, comics, animations, drawings, mprins, mprins creations">
    <link rel="icon" href="media/logo.png" type="image/x-icon">

    <meta property="og:title" content="Mprins Creations">
    <meta property="og:description" content="I make art, comics and animations">
    <meta property="og:image" content="https://mprins-creations.com/media/social-preview.png">
    <meta property="og:type" content="website">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Mprins Creations">
    <meta name="twitter:description" content="I make art, comics and animations">
    <meta name="twitter:image" content="https://mprins-creations.com/media/social-preview.png">
    <meta name="twitter:creator" content="@mprinscreations">
</head>

<body>
    <header id="navbar-container"></header>

    <main>
        <!-- Hero Banner -->
        <section id="hero">
            <!-- Will get replaced with an actual video or slideshow in the future
            <video class="hero-video" autoplay muted loop playsinline>
                <source src="actual-video.mp4" type="video/mp4">
            </video>
            -->
            <img src="https://placehold.co/1920x1080" alt="Hero Image" class="hero-video">
            <figure class="hero-logo hover-tilt">
                <img src="media/logo.png" alt="Mprins Creations Logo">
            </figure>
            <div class="wave-divider"></div>
        </section>


    </main>

    <footer id="footer-container"></footer>
</body>

</html>
