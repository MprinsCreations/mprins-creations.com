<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/illustrations.css">

    <script src="js/components.js"></script>
    <script src="js/navbar-scroll.js"></script>
    <script src="js/wave-divider.js" defer></script>
    <script src="js/icon-divider.js" defer></script>
    <script src="https://kit.fontawesome.com/c19e667509.js" crossorigin="anonymous"></script>

    <title>Illustrations - Mprins Creations</title>
    <meta name="description" content="I make art, comics and animations">
    <meta name="keywords" content="Art, comics, animations, drawings, mprins, mprins creations">
    <link rel="icon" href="media/cat-light.png" type="image/x-icon">

    <meta property="og:title" content="Mprins Creations">
    <meta property="og:description" content="I make art, comics and animations">
    <meta property="og:image" content="https://mprins-creations.com/media/social-preview.png">
    <meta property="og:type" content="website">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Mprins Creations">
    <meta name="twitter:description" content="I make art, comics and animations">
    <meta name="twitter:image" content="https://mprins-creations.com/media/social-preview.png">
    <meta name="twitter:creator" content="@mprinscreations">
</head>

<body>
    <header id="navbar-container"></header>

    <main>
        <section id="header">
            <img src="https://placehold.co/1920x1080" alt="Header Image" class="header-video">
            <div class="header-content">
                <h1>Illustrations</h1>
                <p>Some description</p>
            </div>
            <div class="wave-divider"></div>
        </section>

        <section id="illustrations">
            <article class="illustration">
                <figure class="illustration-image">
                    <img src="https://placehold.co/400x400" alt="Illustration 1">
                </figure>
                <div class="illustration-info">
                    <h4>Title</h4>
                    <p>Description of the illustration.</p>

                    <button popovertarget="project1" class="button bottom">View Process <i class="fas fa-chevron-right"></i></button>
                </div>
            </article>
            <div id="project1" popover>
                <h3>Project 1</h3>
                <p>Hello!</p>

                <button popovertarget="project1" popovertargetaction="hide">
                    Close
                </button>
            </div>

            <div class="icon-divider"></div>

            <article class="illustration">
                <figure class="illustration-image">
                    <img src="https://placehold.co/400x400" alt="Illustration 2">
                </figure>
                <div class="illustration-info">
                    <h4>Title</h4>
                    <p>Description of the illustration.</p>

                    <button popovertarget="project2" class="button bottom">View Process <i class="fas fa-chevron-right"></i></button>
                </div>
            </article>
                        <div id="project2" popover>
                <h3>Project 2</h3>
                <p>Hi!</p>

                <button popovertarget="project2" popovertargetaction="hide">
                    Close
                </button>
            </div>

            <div class="icon-divider" data-flipped="true"></div>

            <article class="illustration">
                <figure class="illustration-image">
                    <img src="https://placehold.co/400x400" alt="Illustration 3">
                </figure>
                <div class="illustration-info">
                    <h4>Title</h4>
                    <p>Description of the illustration.</p>

                    <button popovertarget="project3" class="button bottom">View Process <i class="fas fa-chevron-right"></i></button>
                </div>
            </article>
            <div id="project3" popover>
                <h3>Project 3</h3>
                <p>Heya!</p>

                <button popovertarget="project3" popovertargetaction="hide">
                    Close
                </button>
            </div>
        </section>
    </main>

    <footer id="footer-container" class="background-pink"></footer>
</body>

</html>
